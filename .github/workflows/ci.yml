name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling editables
          pip install pytest pytest-cov click
          pip install -e . --no-build-isolation

      - name: Verify import works
        run: python -c "from datacloak import mask, scan; print('Import OK')"

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=datacloak --cov-report=term-missing

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install --upgrade pip
          pip install build twine hatchling
          python -m build
          twine check dist/*