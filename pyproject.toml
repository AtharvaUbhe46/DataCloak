[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "datacloak"
version = "0.2.1"
description = "Privacy protection library for detecting and masking PII in text, logs, and files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Atharva Ubhe" },
]
keywords = [
    "pii",
    "privacy",
    "data-masking",
    "gdpr",
    "aadhaar",
    "pan",
    "compliance",
    "security",
    "redaction",
    "india",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "hatchling",
    "build",
    "twine",
]

[project.scripts]
datacloak = "datacloak.cli:main"

[project.urls]
Homepage       = "https://github.com/datacloak/datacloak"
Documentation  = "https://datacloak.readthedocs.io"
Repository     = "https://github.com/datacloak/datacloak"
"Bug Tracker"  = "https://github.com/datacloak/datacloak/issues"
Changelog      = "https://github.com/datacloak/datacloak/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Hatch configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["datacloak"]

[tool.hatch.build.targets.sdist]
include = [
    "/datacloak",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "--tb=short -q"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source   = ["datacloak"]
branch   = true
omit     = ["datacloak/cli.py"]  # CLI tested via integration; omit from branch coverage

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under   = 85

# ---------------------------------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true
